name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # No `version:` input: pnpm/action-setup@v4 reads it from the
      # `packageManager` field in package.json (specifying both is an error).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native bridges (TTS + whisper-server)
        run: pnpm build:native

      - name: Build app
        run: pnpm build

      - name: Package and publish installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds: NO signing secrets are exported here on purpose.
          # An *empty* CSC_LINK is worse than none — electron-builder resolves
          # it against the project dir and aborts macOS packaging with
          # "<projectDir> not a file". To enable signing later, re-add:
          #   CSC_LINK: ${{ secrets.CSC_LINK }}
          #   CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # plus APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
          # for macOS notarization. Until then mac artifacts are unsigned
          # (Gatekeeper will prompt on first launch).
        run: npx electron-builder --publish always
